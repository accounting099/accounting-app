<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>النظام المحاسبي المتكامل</title>

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المحاسبي">
  <meta name="theme-color" content="#0b1748">
  <meta name="description" content="النظام المحاسبي الشامل لإدارة اليوميات والموازين والقوائم المالية">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- إعدادات رابط النظام المحاسبي (يتم تعديل الرابط من ملف config.js على GitHub) -->
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1748;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* شاشة التحميل الأولية */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, #1d357d 0%, #0b1748 60%, #060d2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      padding: 24px;
      text-align: center;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .splash-subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .splash-loader {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(251, 191, 36, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* إطار التطبيق الرئيسي */
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      background-color: #0b1748;
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل الأولية -->
  <div id="splashScreen">
    <img src="icon-192.png" alt="شعار النظام" class="splash-logo">
    <div class="splash-title">النظام المحاسبي المتكامل</div>
    <div class="splash-loader"></div>
  </div>

  <!-- إطار التطبيق الرئيسي لكامل الشاشة -->
  <iframe 
    id="appFrame" 
    allow="clipboard-read; clipboard-write; camera; geolocation; microphone" 
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads allow-presentation allow-top-navigation-by-user-activation">
  </iframe>

  <script>
    // ══════════════════════════════════════════════════════════════
    // رابط النظام الافتراضي (يمكنك أيضاً تغييره مباشرة من ملف config.js على GitHub)
    // ══════════════════════════════════════════════════════════════
    const HARDCODED_GAS_URL = "https://script.google.com/macros/s/AKfycbzSPAsBOG1W1WsptbWcgS5Re-Q7pyU1DMkpjHr2k-IKtzK9AMdr8lzjx9_kUgvWw3Dw3Q/exec"; 

    function getAppUrl() {
      if (window.APPS_SCRIPT_URL && window.APPS_SCRIPT_URL.trim().length > 10) {
        return window.APPS_SCRIPT_URL.trim();
      }
      return HARDCODED_GAS_URL;
    }

    function initApp() {
      const url = getAppUrl();
      const currentParams = window.location.search;
      let finalUrl = url;
      if (currentParams) {
        const separator = finalUrl.includes('?') ? '&' : '?';
        finalUrl = finalUrl + separator + currentParams.substring(1);
      }

      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;

      // إخفاء شاشة التحميل بعد اكتمال تحميل الإطار
      frame.onload = function() {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      };

      // مؤقت أمان في حال بطء استجابة السيرفر
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash && splash.style.display !== 'none') {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      }, 7000);
    }

    // تسجيل Service Worker في الخلفية للحفاظ على معايير التطبيق المستقل
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(() => {});
      });
    }

    // استقبال إشارة إعادة تحميل التطبيق أو تسجيل الخروج من داخل الإطار
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'APP_LOGOUT') {
        // تم التبديل المباشر لشاشة تسجيل الدخول داخل الإطار بدون إعادة تحميل وبدون شاشة زرقاء
        try {
          const u = new URL(window.location.href);
          u.searchParams.delete('token');
          u.searchParams.delete('ticket');
          u.searchParams.delete('mode');
          u.searchParams.delete('_r');
          window.history.replaceState(null, 'النظام المحاسبي | تسجيل الدخول', u.pathname + (u.search ? u.search : ''));
        } catch(e){}
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 200);
        }
        return;
      }
      if (event.data.type === 'APP_RELOAD_IFRAME') {
        const frame = document.getElementById('appFrame');
        if (frame) {
          const splash = document.getElementById('splashScreen');
          if (splash) {
            splash.style.display = 'flex';
            splash.style.opacity = '1';
          }
          const dismissSplash = () => {
            if (splash) {
              splash.style.opacity = '0';
              setTimeout(() => { splash.style.display = 'none'; }, 400);
            }
          };
          frame.onload = dismissSplash;
          setTimeout(dismissSplash, 2500);

          let targetUrl = event.data.url || getAppUrl();
          if (typeof targetUrl !== 'string' || targetUrl.includes('googleusercontent.com')) {
            targetUrl = getAppUrl();
          }
          const sep = targetUrl.includes('?') ? '&' : '?';
          frame.src = targetUrl + sep + '_r=' + Date.now();
        }
      }
    });

    // تشغيل النظام فور جاهزية الصفحة
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
