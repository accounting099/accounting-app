<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>النظام المحاسبي | شركة المنصورة للراتنجات</title>

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المحاسبي">
  <meta name="theme-color" content="#0b1748">
  <meta name="description" content="النظام المحاسبي الشامل لإدارة اليوميات والموازين والقوائم المالية">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1748;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* شاشة التحميل الأولية */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, #1d357d 0%, #0b1748 60%, #060d2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      padding: 24px;
      text-align: center;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .splash-subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .splash-loader {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(251, 191, 36, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* إطار التطبيق الرئيسي */
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      background-color: #0b1748;
    }

    /* شريط تثبيت PWA الذكي */
    #pwaInstallBanner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      border-radius: 50px;
      padding: 10px 18px;
      align-items: center;
      gap: 12px;
      max-width: 90vw;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 60px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .pwa-btn-install {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0b1426;
      border: none;
      font-weight: bold;
      font-size: 13.5px;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
      white-space: nowrap;
    }

    .pwa-btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    /* شاشة الإعداد إذا لم يتم ضبط الرابط */
    #setupModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 13, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10001;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .setup-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    .setup-title {
      font-size: 18px;
      font-weight: bold;
      color: #fbbf24;
      margin-bottom: 12px;
    }

    .setup-desc {
      font-size: 13.5px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .setup-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      direction: ltr;
      text-align: left;
      margin-bottom: 16px;
    }

    .setup-input:focus {
      border-color: #fbbf24;
    }

    .setup-save-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0b1426;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14.5px;
      cursor: pointer;
    }

    /* زر الإعدادات الصغير في الزاوية */
    #configGearBtn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9998;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    #configGearBtn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل / سبلاش سكرين -->
  <div id="splashScreen">
    <img src="icon-192.png" alt="شعار النظام" class="splash-logo">
    <div class="splash-title">النظام المحاسبي المتكامل</div>
    <div class="splash-subtitle">شركة المنصورة للراتنجات والصناعات الكيماوية</div>
    <div class="splash-loader"></div>
  </div>

  <!-- زر ضبط الرابط السري عند الحاجة -->
  <button id="configGearBtn" onclick="openSetupModal()" title="إعدادات الرابط">⚙️</button>

  <!-- إطار التطبيق الذي يعرض Google Apps Script -->
  <iframe 
    id="appFrame" 
    allow="clipboard-read; clipboard-write; camera; geolocation; microphone" 
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads allow-presentation">
  </iframe>

  <!-- شريط التثبيت المباشر للهاتف والكمبيوتر -->
  <div id="pwaInstallBanner">
    <span style="font-size:18px;">📲</span>
    <span style="font-size:13px;font-weight:600;color:#f8fafc;">تثبيت النظام كتطبيق على جهازك</span>
    <button class="pwa-btn-install" onclick="triggerPwaInstall()">تثبيت الآن ⬇️</button>
    <button class="pwa-btn-close" onclick="dismissInstallBanner()">&times;</button>
  </div>

  <!-- نافذة إعداد الرابط (تظهر لأول مرة فقط إذا لم يكن الرابط مسجلاً مسبقاً) -->
  <div id="setupModal">
    <div class="setup-box">
      <div class="setup-title">⚙️ ضبط رابط النظام المحاسبي</div>
      <div class="setup-desc">
        يرجى لصق رابط الويب الخاص بنظامك من Google Apps Script (ينتهي بـ <code>/exec</code>):
      </div>
      <input type="url" id="gasUrlInput" class="setup-input" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="setup-save-btn" onclick="saveGasUrl()">حفظ وتشغيل النظام 🚀</button>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    // يمكنك كتابة رابط Google Apps Script الخاص بك هنا مباشرة:
    // ══════════════════════════════════════════════════════════════
    const HARDCODED_GAS_URL = ""; 

    function getAppUrl() {
      if (HARDCODED_GAS_URL && HARDCODED_GAS_URL.trim().length > 10) {
        return HARDCODED_GAS_URL.trim();
      }
      return localStorage.getItem('mansoura_gas_url') || '';
    }

    function initApp() {
      const url = getAppUrl();
      if (!url) {
        document.getElementById('splashScreen').style.display = 'none';
        openSetupModal();
        return;
      }

      // تمرير أي معاملات إضافية (مثل mode=manager أو ticket=...)
      const currentParams = window.location.search;
      let finalUrl = url;
      if (currentParams) {
        const separator = finalUrl.includes('?') ? '&' : '?';
        finalUrl = finalUrl + separator + currentParams.substring(1);
      }

      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;

      // إخفاء شاشة التحميل بعد اكتمال تحميل الإطار
      frame.onload = function() {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      };

      // مؤقت أمان في حال بطء الاستجابة
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash && splash.style.display !== 'none') {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      }, 7000);
    }

    function openSetupModal() {
      const cur = getAppUrl();
      if (cur) document.getElementById('gasUrlInput').value = cur;
      document.getElementById('setupModal').style.display = 'flex';
    }

    function saveGasUrl() {
      const input = document.getElementById('gasUrlInput').value.trim();
      if (!input || !input.startsWith('https://script.google.com/')) {
        alert('يرجى إدخال رابط صحيح لـ Google Apps Script يبدأ بـ https://script.google.com/');
        return;
      }
      localStorage.setItem('mansoura_gas_url', input);
      document.getElementById('setupModal').style.display = 'none';
      document.getElementById('splashScreen').style.display = 'flex';
      document.getElementById('splashScreen').style.opacity = '1';
      initApp();
    }

    // ══════════════════════════════════════════════════════════════
    // تسجيل Service Worker لتمكين معايير PWA الرسمية والتثبيت
    // ══════════════════════════════════════════════════════════════
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
          .catch((err) => console.error('PWA Service Worker failed:', err));
      });
    }

    // ══════════════════════════════════════════════════════════════
    // التعامل مع حدث تثبيت التطبيق التلقائي (Chrome Android / PC)
    // ══════════════════════════════════════════════════════════════
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const isDismissed = sessionStorage.getItem('pwa_banner_dismissed') === 'true';
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (!isDismissed && !isStandalone) {
        document.getElementById('pwaInstallBanner').style.display = 'flex';
      }
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            dismissInstallBanner();
          }
          deferredPrompt = null;
        });
      } else {
        alert('لتثبيت التطبيق: اضغط على خيارات المتصفح (⋮) ثم اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
      }
    }

    function dismissInstallBanner() {
      document.getElementById('pwaInstallBanner').style.display = 'none';
      try { sessionStorage.setItem('pwa_banner_dismissed', 'true'); } catch(e) {}
    }

    // بدء تشغيل التطبيق
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
