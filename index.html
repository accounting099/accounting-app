<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>النظام المحاسبي | شركة المنصورة للراتنجات</title>

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المحاسبي">
  <meta name="theme-color" content="#0b1748">
  <meta name="description" content="النظام المحاسبي الشامل لإدارة اليوميات والموازين والقوائم المالية">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- إعدادات رابط النظام المحاسبي (يتم تعديل الرابط من ملف config.js على GitHub) -->
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1748;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* شاشة التحميل الأولية */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top right, #1d357d 0%, #0b1748 60%, #060d2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      padding: 24px;
      text-align: center;
    }

    .splash-logo {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .splash-subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .splash-loader {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(251, 191, 36, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* إطار التطبيق الرئيسي */
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 1;
      background-color: #0b1748;
    }

    /* زر التحديث السريع (Refresh) الذكي */
    #refreshAppBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 99999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(11, 23, 72, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      opacity: 0.8;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    #refreshAppBtn:hover, #refreshAppBtn:active {
      opacity: 1;
      transform: scale(1.08);
      background: rgba(15, 23, 42, 0.95);
      border-color: #fbbf24;
      box-shadow: 0 10px 28px rgba(251, 191, 36, 0.35);
    }

    .spin-active {
      animation: spinRefresh 0.75s linear infinite !important;
    }

    @keyframes spinRefresh {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- شاشة التحميل الأولية بهوية الشركة -->
  <div id="splashScreen">
    <img src="icon-192.png" alt="شعار النظام" class="splash-logo">
    <div class="splash-title">النظام المحاسبي المتكامل</div>
    <div class="splash-subtitle">شركة المنصورة للراتنجات والصناعات الكيماوية</div>
    <div class="splash-loader"></div>
  </div>

  <!-- زر تحديث النظام السريع الذكي (Refresh) لجلب أحدث إصدار -->
  <button type="button" id="refreshAppBtn" onclick="refreshApp()" title="تحديث النظام لجلب آخر التعديلات" aria-label="تحديث">
    <svg id="refreshIcon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
    </svg>
  </button>

  <!-- إطار التطبيق الرئيسي لكامل الشاشة -->
  <iframe 
    id="appFrame" 
    allow="clipboard-read; clipboard-write; camera; geolocation; microphone" 
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals allow-downloads allow-presentation">
  </iframe>

  <script>
    // ══════════════════════════════════════════════════════════════
    // رابط النظام الافتراضي (يمكنك أيضاً تغييره مباشرة من ملف config.js على GitHub)
    // ══════════════════════════════════════════════════════════════
    const HARDCODED_GAS_URL = "https://script.google.com/macros/s/AKfycbzSPAsBOG1W1WsptbWcgS5Re-Q7pyU1DMkpjHr2k-IKtzK9AMdr8lzjx9_kUgvWw3Dw3Q/exec"; 

    function getAppUrl() {
      if (window.APPS_SCRIPT_URL && window.APPS_SCRIPT_URL.trim().length > 10) {
        return window.APPS_SCRIPT_URL.trim();
      }
      return HARDCODED_GAS_URL;
    }

    function initApp() {
      const url = getAppUrl();
      const currentParams = window.location.search;
      let finalUrl = url;
      if (currentParams) {
        const separator = finalUrl.includes('?') ? '&' : '?';
        finalUrl = finalUrl + separator + currentParams.substring(1);
      }

      const frame = document.getElementById('appFrame');
      frame.src = finalUrl;

      // إخفاء شاشة التحميل بعد اكتمال تحميل الإطار
      frame.onload = function() {
        const splash = document.getElementById('splashScreen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      };

      // مؤقت أمان في حال بطء استجابة السيرفر
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        if (splash && splash.style.display !== 'none') {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 500);
        }
      }, 7000);
    }

    // ══════════════════════════════════════════════════════════════
    // وظيفة زر التحديث الذكي: تنظيف الكاش وجلب أحدث كود فوراً
    // ══════════════════════════════════════════════════════════════
    function refreshApp() {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('spin-active');

      const splash = document.getElementById('splashScreen');
      if (splash) {
        const subtitle = splash.querySelector('.splash-subtitle');
        if (subtitle) subtitle.textContent = 'جاري جلب أحدث تحديث للنظام...';
        splash.style.display = 'flex';
        setTimeout(() => { splash.style.opacity = '1'; }, 20);
      }

      // مسح كاش المتصفح تلقائياً
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        });
      }

      // إعادة قراءة config.js برقم زمني لمنع التخزين المؤقت
      const script = document.createElement('script');
      script.src = 'config.js?_ts=' + Date.now();
      const doReload = () => {
        const url = getAppUrl();
        const separator = url.includes('?') ? '&' : '?';
        const freshUrl = url + separator + '_refresh=' + Date.now();
        const frame = document.getElementById('appFrame');
        if (frame) {
          frame.src = freshUrl;
        }
      };
      script.onload = doReload;
      script.onerror = doReload;
      document.head.appendChild(script);

      setTimeout(() => {
        if (icon) icon.classList.remove('spin-active');
      }, 1500);
    }

    // تسجيل Service Worker في الخلفية للحفاظ على معايير التطبيق المستقل
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(() => {});
      });
    }

    // تشغيل النظام فور جاهزية الصفحة
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
